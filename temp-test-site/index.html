<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>temp-test-site</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
        color: #111827;
        background: #f9fafb;
      }
      body {
        max-width: 44rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      a {
        color: #2563eb;
      }
      code {
        background: #e5e7eb;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.9em;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1.25rem 1.5rem;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="margin-top: 0">temp-test-site</h1>
      <p>
        请从本机启动的 Node 服务打开（默认端口 <code>3000</code>，可由环境变量
        <code>PORT</code> 覆盖），路径前缀为 <code>/frontend/temp-test-site/</code>。
      </p>
      <ul>
        <li><a href="./smoke.html">smoke.html</a> — 健康检查 + 登录 + <code>/api/auth/me</code></li>
      </ul>
      <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 0">
        勿使用 <code>file://</code> 打开：无法与 <code>/api</code> 同源，也无法写入会话 Cookie。
      </p>
    </div>
  </body>
</html>
